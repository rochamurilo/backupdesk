name: Windows VSS component
on:
  workflow_dispatch:
    inputs:
      source_only:
        description: Testar componente VSS e rede sem executar instaladores
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'disk-backup.mjs'
      - 'agent-schedule-state.mjs'
      - 'test/backup-links.test.mjs'
      - 'test/agent-schedule-state.test.mjs'
      - 'restic*.mjs'
      - 'tools/fetch-restic*'
      - 'test/restic*.mjs'
      - 'crypto-vault.mjs'
      - 'encrypted-files.mjs'
      - 'office-client.mjs'
      - 'office-receiver.mjs'
      - 'windows/protect-key.ps1'
      - 'windows/encrypted-backup-check.mjs'
      - 'calendar-events.mjs'
      - 'local-master.mjs'
      - 'server.mjs'
      - 'encryption-service.mjs'
      - 'test/local-client.test.mjs'
      - 'preferences.mjs'
      - 'network-share.mjs'
      - 'status-logs.mjs'
      - 'log-settings.mjs'
      - 'logs-io.mjs'
      - 'overview-status.mjs'
      - 'overview-notifications.mjs'
      - 'windows/network-share*'
      - 'test/windows-network-share.ps1'
      - 'bandwidth.mjs'
      - 'catalog-transfer.mjs'
      - 'agent.mjs'
      - 'master.mjs'
      - 'background.mjs'
      - 'test/performance.test.mjs'
      - 'test/catalog-batch-api.test.mjs'
      - 'restore-tree.mjs'
      - 'filesystem.mjs'
      - 'test/selected-volume.test.mjs'
      - 'repository-catalog.mjs'
      - 'repository-store.mjs'
      - 'client-package.mjs'
      - 'windows/client-preflight.nsh'
      - 'windows/installation-preflight.nsh'
      - 'installation-update.mjs'
      - 'test/installation-update.test.mjs'
      - 'test/windows-update-only.ps1'
      - 'test/client-key-preservation.test.mjs'
      - 'windows/installer.nsi'
      - 'windows/launcher.nsi'
      - 'windows/launch-agent.mjs'
      - 'windows/Configure.ps1'
      - 'test/windows-client-install.ps1'
      - 'test/client-package.test.mjs'
      - 'dist/BackupDesk-Master-0.31.0-x64.exe'
      - 'backup-repository.mjs'
      - 'vss.mjs'
      - 'filesystem.mjs'
      - 'windows/update-application.ps1'
      - 'background.mjs'
      - 'test/windows-update.ps1'
      - 'windows/vss*.ps1'
      - 'windows/install-vss-component.ps1'
      - 'test/windows-vss*.ps1'
      - '.github/workflows/windows-vss.yml'
permissions:
  contents: read
jobs:
  native-vss:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            windows
            test
            tools
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Fetch pinned Restic
        shell: powershell
        run: ./tools/fetch-restic.ps1
      - name: Test protected automatic component and locked file snapshot
        shell: powershell
        run: |
          try { ./test/windows-vss-component.ps1 }
          catch {
            $detail=($env:BACKUPDESK_TEST_FAILURE_STAGE+' '+$env:BACKUPDESK_TEST_STAGE+' '+$_.Exception.Message+' '+$_.ScriptStackTrace+' '+$_.InvocationInfo.PositionMessage).Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
            Write-Output "::error title=Windows VSS diagnostic::$detail"
            throw
          }
      - name: Test scoped update shutdown and automatic user startup
        shell: powershell
        run: |
          try { ./test/windows-update.ps1 }
          catch {
            $detail=($_.Exception.Message+' '+$_.ScriptStackTrace+' '+$_.InvocationInfo.PositionMessage).Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
            Write-Output "::error title=Windows update diagnostic::$detail"
            throw
          }
  native-update:
    runs-on: windows-2025
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            windows
            test
            tools
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test update shutdown and normal-user logon task
        shell: powershell
        run: |
          try { ./test/windows-update.ps1 }
          catch {
            $detail=($_.Exception.Message+' '+$_.ScriptStackTrace+' '+$_.InvocationInfo.PositionMessage).Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
            Write-Output "::error title=Windows update diagnostic::$detail"
            throw
          }

  native-client-install:
    if: ${{ !inputs.source_only }}
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/*/
            /windows/
            /test/
            /dist/BackupDesk-Master-0.25.0-x64.exe
            /dist/BackupDesk-Master-0.31.0-x64.exe
            /dist/BackupDesk-Atualizacao-Client-0.31.0-x64.exe
            /dist/BackupDesk-Atualizacao-Master-0.31.0-x64.exe
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test bandwidth schedules
        run: node --test test/preferences-bandwidth.test.mjs
      - name: Test selected source volume and signed logs
        run: node --test test/selected-volume.test.mjs
      - name: Test bounded batches and background policy
        run: node --test test/performance.test.mjs
      - name: Test persistent client identity
        run: node --test test/client-package.test.mjs
      - name: Test real named installer and update
        shell: powershell
        run: |
          try { ./test/windows-client-install.ps1 }
          catch {
            $detail=($_.Exception.Message+' '+$_.ScriptStackTrace+' '+$_.InvocationInfo.PositionMessage).Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
            Write-Output "::error title=Windows client diagnostic::$detail"
            throw
          }
      - name: Test update-only client and master packages
        shell: powershell
        run: |
          try { ./test/windows-update-only.ps1 }
          catch {
            $detail=($_.Exception.Message+' '+$_.ScriptStackTrace+' '+$_.InvocationInfo.PositionMessage).Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
            Write-Output "::error title=Windows update-only diagnostic::$detail"
            throw
          }

  native-network:
    runs-on: windows-2025
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            windows
            test
            tools
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Fetch pinned Restic
        shell: powershell
        run: ./tools/fetch-restic.ps1
      - name: Test authenticated SMB destination
        shell: powershell
        run: |
          try { ./test/windows-network-share.ps1 }
          catch {
            $detail=($_.Exception.Message+' '+$_.ScriptStackTrace+' '+$_.InvocationInfo.PositionMessage).Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
            Write-Output "::error title=Windows SMB diagnostic::$detail"
            throw
          }
